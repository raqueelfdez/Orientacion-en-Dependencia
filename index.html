const NOVEDADES = [
  { id: 9, tipo: "Normativa estatal", icon: Ico, titulo: "Ley 4/2026: reforma estatal de la dependencia",

  { id: 5, tipo: "Normativa estatal", icon: Ico, titulo: "Dependencia = discapacidad reconocida",

    detalle: "La equiparación es automática y evita hacer dos trámites. Solo tiene efecto donde una ley lo prevea y no se aplica en el ámbito tributario. No sirve por sí sola para la pensión no contributiva ni la asignación por hijo a cargo, que siguen exigiendo una discapacidad reconocida de al menos el 65 %, ni da derecho a la tarjeta de aparcamiento. La ley tampoco crea un grado III+ estatal. La persona puede pedir la valoración de su discapacidad real si le conviene un grado mayor. Fuente: Ley 4/2026, de 1 de octubre (BOE núm. 246, 3-10-2026, BOE-A-2026-20528). Entra en vigor a los 20 días de su publicación, el 23 de octubre de 2026. Falta su desarrollo y la adaptación de la normativa andaluza." },
  { id: 6, tipo: "Servicios", icon: Ico, titulo: "Nuevo catálogo de servicios",
    resumen: "Teleasistencia como derecho subjetivo, asistencia personal ampliada, viviendas con apoyos y productos de apoyo.",
    detalle: "Teleasistencia: se reconoce como derecho subjetivo para toda persona en situación de dependencia, en cualquier grado, con independencia de las demás prestaciones de su PIA según la prensa especializada. Asistencia personal: pasa a ser un servicio del catálogo, sin limitarse al ámbito educativo o laboral, y se extiende a cualquier grado y edad. Cuidados y apoyos en viviendas: nuevo servicio con dos modalidades, con y sin alojamiento. Productos de apoyo: nuevo servicio, posible por préstamo o cesión temporal. Promoción de la autonomía personal: se define como servicio. SAD: se amplía al entorno comunitario próximo y podrá organizarse de forma colectiva para un grupo reducido que lo solicite. Centros de día: actividades significativas y posibilidad de ser centros multiservicios. Residencias: entorno más hogareño y uso de sujeciones solo en casos excepcionales de urgencia vital. Fuente: Ley 4/2026, de 1 de octubre (BOE núm. 246, 3-10-2026, BOE-A-2026-20528). Entra en vigor a los 20 días de su publicación, el 23 de octubre de 2026. Falta su desarrollo y la adaptación de la normativa andaluza." },
  { id: 1, tipo: "Cuantías", icon: Ico, titulo: "IPREM y cálculo del copago",
    resumen: "El IPREM es la referencia para fijar la capacidad económica. La ley estatal encarga nuevos criterios de copago.",
    detalle: "La ley manda al Consejo Territorial acordar criterios de capacidad económica que excluyan siempre la vivienda habitual y fijen mínimos exentos de renta y patrimonio. La capacidad económica será exclusivamente personal y ninguna persona quedará fuera del sistema por falta de recursos. Las comunidades autónomas regulan la participación en el coste y deben garantizar un mínimo exento. El copago no podrá disuadir de usar los servicios ni llevar a usarlos con menos intensidad de la necesaria. Mientras no haya acuerdo, siguen vigentes las reglas actuales. El IPREM de 2026 sigue en 600 euros al mes (7.200 al año en 12 pagas y 8.400 en 14), igual que desde 2023, al no haberse aprobado nuevos Presupuestos Generales del Estado. Confirme los umbrales en el BOE y el BOJA. Fuente: Ley 4/2026, de 1 de octubre (BOE núm. 246, 3-10-2026, BOE-A-2026-20528). Entra en vigor a los 20 días de su publicación, el 23 de octubre de 2026. Falta su desarrollo y la adaptación de la normativa andaluza." },
  { id: 3, tipo: "Servicios", icon: Ico, titulo: "Mapa de compatibilidades",

    detalle: "Dentro de las intensidades de cada grado, desaparece el régimen estatal de incompatibilidades para facilitar combinar servicios y prestaciones económicas. No cambia el régimen que ya establecen las comunidades autónomas, que sigue vigente. En Andalucía, hasta que la Junta lo modifique, hay que seguir aplicando sus reglas sobre la combinación de SAD, PECEF y otros recursos. La combinación se articulará dentro de las intensidades de cada grado, según el PIA. Confirme cada combinación con Servicios Sociales. Fuente: Ley 4/2026, de 1 de octubre (BOE núm. 246, 3-10-2026, BOE-A-2026-20528). Entra en vigor a los 20 días de su publicación, el 23 de octubre de 2026. Falta su desarrollo y la adaptación de la normativa andaluza." },
  { id: 7, tipo: "Servicios", icon: Ico, titulo: "PECEF: cambios para las familias cuidadoras",
    resumen: "Se elimina el plazo suspensivo de dos años (la espera para empezar a cobrar) y se reconocen derechos a la persona cuidadora.",
    detalle: "La persona cuidadora podrá ser del ámbito familiar o del relacional (por ejemplo, vecindad o amistad). Se incorporan sus derechos. Las PECEF suspendidas antes de la entrada en vigor se reactivan y recuperan su cuantía (disposición adicional décima). Las condiciones de acceso las acordará el Consejo Territorial y las aprobará el Gobierno por real decreto. La persona cuidadora principal tendrá derecho a su incorporación a la Seguridad Social y será colectivo de atención prioritaria en las políticas de empleo. Pendiente de ver cómo lo aplica Andalucía. Fuente: Ley 4/2026, de 1 de octubre (BOE núm. 246, 3-10-2026, BOE-A-2026-20528). Entra en vigor a los 20 días de su publicación, el 23 de octubre de 2026. Falta su desarrollo y la adaptación de la normativa andaluza." },
  { id: 4, tipo: "Tramitación ASSDA", icon: Ico, titulo: "PIA, revisión y valoración",
    resumen: "El PIA y su revisión se agilizan y se pone el foco en la voluntad y las preferencias de la persona.",
    detalle: "Se explicitan situaciones de especial vulnerabilidad que deben atenderse con urgencia. La escala de valoración específica (EVE) se amplía de los 3 a los 6 años. La ley prevé un nuevo baremo de valoración, una ventanilla única del sistema y mecanismos comunes de acceso a datos sanitarios para agilizar la tramitación. Desde el 23 de octubre de 2026 el plazo máximo para resolver el reconocimiento de la dependencia es de tres meses (así lo recogen varias fuentes especializadas; confírmelo en el artículo segundo del BOE). El nuevo baremo de valoración tiene un plazo de 12 meses. Todo ello necesita desarrollo posterior. Fuente: Ley 4/2026, de 1 de octubre (BOE núm. 246, 3-10-2026, BOE-A-2026-20528). Entra en vigor a los 20 días de su publicación, el 23 de octubre de 2026. Falta su desarrollo y la adaptación de la normativa andaluza." },
  { id: 2, tipo: "Tramitación ASSDA", icon: Ico, titulo: "Ventanilla Electrónica de Dependencia",
    resumen: "Canal telemático para presentar solicitudes, aportar documentos y consultar el estado del expediente.",
    detalle: "Permite acceder con certificado digital o Cl@ve. Los Servicios Sociales Comunitarios siguen atendiendo de forma presencial a quien no pueda tramitar por vía electrónica. Un acuerdo del Consejo de Gobierno de 6 de mayo de 2026 (BOJA n.º 90, de 13-5-2026), sobre el refuerzo de los Servicios Sociales Comunitarios en dependencia, recoge la Ventanilla Electrónica como vía preferente de entrada de solicitudes y como instrumento ordinario de gestión. La ley estatal prevé además una ventanilla única del sistema. Compruebe en el portal de la Junta las funcionalidades vigentes." },
  { id: 8, tipo: "Normativa estatal", icon: Ico, titulo: "Idoneidad de quien cuida",
    resumen: "Para trabajar con personas con discapacidad o dependencia se exigirá no tener antecedentes por determinados delitos.",
    detalle: "Afecta a actividades con contacto habitual con estas personas. También se endurecen las infracciones laborales en este ámbito. Revise con la entidad empleadora o el servicio qué certificado debe aportarse una vez entre en vigor. Fuente: Ley 4/2026, de 1 de octubre (BOE núm. 246, 3-10-2026, BOE-A-2026-20528). Entra en vigor a los 20 días de su publicación, el 23 de octubre de 2026. Falta su desarrollo y la adaptación de la normativa andaluza." },
  { id: 10, tipo: "Cuantías", icon: Ico, titulo: "Exención en el IRPF",
    resumen: "Quedan exentas de IRPF las prestaciones económicas de dependencia para cuidados en el entorno familiar, vinculadas al servicio, de asistencia personal y de cuidados y apoyos en viviendas.",
    detalle: "La exención se aplica desde el 23 de octubre de 2026. La relativa a cuidados y apoyos en viviendas no figuraba antes en la redacción de la ley del IRPF. Para dudas sobre su declaración, consulte a la Agencia Tributaria o a una persona asesora fiscal. Fuente: Ley 4/2026, de 1 de octubre (BOE núm. 246, 3-10-2026, BOE-A-2026-20528). Entra en vigor el 23 de octubre de 2026. Falta su desarrollo y la adaptación de la normativa andaluza." },
  { id: 11, tipo: "Cuantías", icon: Ico, titulo: "Financiación estatal y Real Decreto-ley 17/2026",

  { id: 12, tipo: "Normativa estatal", icon: Ico, titulo: "Qué se aplica ya y qué queda pendiente",

  { id: 13, tipo: "Servicios", icon: Ico, titulo: "Andalucía: plazas residenciales y esperas",
    resumen: "776 millones para concertar más de 26.000 plazas residenciales. La Junta cifra la espera media en 496 días a cierre de 2025.",

];

const FILTROS = ["Todas", "Normativa estatal", "Cuantías", "Servicios", "Tramitación ASSDA"];

const GLOSARIO = [
  ["ASSDA", "Agencia de Servicios Sociales y Dependencia de Andalucía. Gestiona el sistema en la comunidad."],
  ["PIA", "Programa Individual de Atención. Resolución que fija los servicios o prestaciones concretos que corresponden a la persona."],

  I: { min: 20, max: 37, nota: "Grado I (dependencia moderada)" },
  II: { min: 38, max: 64, nota: "Grado II (dependencia severa)" },
  III: { min: 65, max: 94, nota: "Grado III (gran dependencia)" },
};

const PASOS = [
  { t: "Estado del expediente", k: "estado", o: [
    ["sin", "Sin iniciar"], ["valoracion", "Pendiente de valoración de grado"],
    ["pia", "Grado reconocido, pendiente de PIA"], ["revision", "En revisión por empeoramiento"]] },
  { t: "Convivencia y red de apoyo", k: "cuidador", o: [
    ["si_ok", "Cuidador familiar que cumple requisitos de cotización y formación"],

    ["no", "Sin cuidador principal"]] },

    ["sad", "Servicio de Ayuda a Domicilio"], ["cd", "Centro de Día / Participación Activa"],
    ["res", "Atención residencial"], ["pevs", "Prestación Económica Vinculada al Servicio"]] },
  { t: "Capacidad económica orientativa", k: "renta", o: [
    ["b1", "Menos de 1 IPREM mensual"], ["b2", "Entre 1 y 2 IPREM"],
    ["b3", "Entre 2 y 3 IPREM"], ["b4", "Más de 3 IPREM"]] },
];

const COPAGO = {
  b1: "Participación nula o mínima. Probable exención en servicios básicos.",
  b2: "Participación baja. Debe calcularse con la fórmula oficial.",
  b3: "Participación media. Conviene simular con renta y patrimonio reales.",
  b4: "Participación alta. En residencia puede acercarse a una parte sustancial del coste.",
};

function generar(r) {
  const diag = {
    sin: "No consta solicitud. El primer paso es iniciar el procedimiento de reconocimiento de la situación de dependencia.",
    valoracion: "Solicitud presentada. Falta la valoración de grado. Aún no se pueden resolver servicios.",
    pia: "Grado reconocido. El expediente está a la espera de la resolución del PIA, donde se decide el recurso.",
    revision: "Hay grado previo. Procede solicitar revisión por empeoramiento con documentación sanitaria actualizada.",
  }[r.estado];
  const recs = [];
  const nombres = { sad: "Servicio de Ayuda a Domicilio (SAD)", cd: "Centro de Día / Centro de Participación Activa", res: "Atención residencial", pevs: "Prestación Económica Vinculada al Servicio (PEVS)" };
  recs.push(`Recurso preferente: ${nombres[r.recurso]}. Se propone en el PIA, que decide la administración.`);
  if (r.cuidador === "si_ok") recs.push("PECEF: posible con carácter excepcional, al haber cuidador que cumple requisitos. La Ley 4/2026 permite cuidadores del ámbito relacional y elimina el plazo suspensivo de dos años.");
  if (r.cuidador === "si_no") recs.push("PECEF: no recomendable hasta regularizar alta/cotización y formación del cuidador.");
  if (r.cuidador === "no") recs.push("Sin cuidador familiar: priorizar servicio profesional (SAD o centro). Valorar teleasistencia.");
  if (r.recurso === "pevs") recs.push("PEVS: se concede solo cuando no hay plaza o servicio público disponible.");
  recs.push("Teleasistencia: la Ley 4/2026 la reconoce como derecho subjetivo. Pregunte en Servicios Sociales cuándo y cómo se aplica en Andalucía.");
  if (r.recurso === "sad") recs.push("SAD: la Ley 4/2026 lo amplía al entorno próximo y permite organizarlo de forma colectiva. Confirme cuándo lo aplica la Junta.");
  const docs = ["DNI/NIE de la persona y de su representante", "Certificado de empadronamiento", "Informe de Salud (Junta de Andalucía) firmado por su médico", "Datos bancarios", "Declaración de renta o certificado de ingresos y datos patrimoniales", "Acreditación de representación, si procede"];
  if (r.estado === "revision") docs.push("Informes médicos que acrediten el empeoramiento");
  if (r.cuidador !== "no") docs.push("Datos de alta en Seguridad Social y formación del cuidador");
  const vias = ["Servicios Sociales Comunitarios de su zona (presencial, con cita previa)", "Ventanilla Electrónica de Dependencia (certificado digital o Cl@ve)"];
  return { diag, recs, docs, vias, copago: COPAGO[r.renta] };
}

function textoPlan(r, res) {
  const l = (a) => a.map((x) => "- " + x).join("\n");
  return `PLAN DE INTERVENCIÓN (orientativo)\n\nDIAGNÓSTICO\n${res.diag}\n\nRECURSOS RECOMENDADOS\n${l(res.recs)}\n\nCOPAGO\n${res.copago}\n\nDOCUMENTACIÓN\n${l(res.docs)}\n\nVÍAS DE TRAMITACIÓN\n${l(res.vias)}\n\nAviso: resultado orientativo. Verificar con Servicios Sociales y normativa vigente.`;
}



const RESP = [

const SITUACIONES = [["Aún no he solicitado la dependencia",0],["Ya tengo el grado y espero el PIA",1],["Tengo PIA pero no hay plaza",20],["Cuido a un familiar",4],["Mi familiar ha empeorado",18],["No estoy de acuerdo con una resolución",19],["Me mudo de comunidad",21],["¿Qué cambia con la Ley 4/2026?",8]];
const norm = (x) => x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function buscar(q) {
  const n = norm(q);
  const toks = n.split(/[^a-z0-9@\/]+/).filter(Boolean);
  let mejor = -1, max = 0;
  RESP.forEach(([ks], i) => {
    const p = ks.filter((k) => { const kk = norm(k); return (kk.length > 4 || kk.includes(" ")) ? n.includes(kk) : toks.includes(kk); }).length;
    if (p > max) { max = p; mejor = i; }
  });
  return mejor;
}
const FALLBACK = "No tengo una respuesta preparada para eso. Puedo orientarte sobre solicitud, PIA, SAD, PECEF, PEVS, copago, teleasistencia, documentación, recursos y la Ley 4/2026. Para tu caso concreto, acude a los Servicios Sociales de tu zona.";
function respuestaDe(i) { return { content: RESP[i][1], seg: SEG[i] || SEG_BASE }; }
function respuestaLocal(q) { const i = buscar(q); return i < 0 ? { content: FALLBACK, seg: SEG_BASE } : respuestaDe(i); }

function Chat() {
  const [msgs, setMsgs] = useState([{ role: "assistant", content: "¡Hola! Soy Olivia, tu asesora en dependencia. Cuéntame tu situación con tus palabras o elige la que más se parezca a la tuya y te oriento." }]);
  const [txt, setTxt] = useState("");
  const [busy, setBusy] = useState(false);
  const fin = React.useRef(null);
  React.useEffect(() => { fin.current && fin.current.scrollIntoView({ block: "end" }); }, [msgs]);

  const enviar = async (t, idx) => {
    const q = (t || txt).trim();
    if (!q || busy) return;
    setTxt(""); setBusy(true);
    const hist = [...msgs.map((m) => ({ role: m.role, content: m.content })), { role: "user", content: q }];
    setMsgs([...hist, { role: "assistant", content: "" }]);
    const poner = (c) => setMsgs([...hist, typeof c === "string" ? { role: "assistant", content: c } : { role: "assistant", content: c.content, seg: c.seg }]);
    try {
      await new Promise((r) => setTimeout(r, 600));
      poner(typeof idx === "number" ? respuestaDe(idx) : respuestaLocal(q));
    } catch (e) {
      poner(e && e.code === "not_granted" ? "Necesito tu permiso para responder. Vuelve a enviar el mensaje y acéptalo." : "No he podido responder. Inténtalo de nuevo en un momento.");
    }
    setBusy(false);
  };

  return (
    <section className="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden flex flex-col chatbox" style={{ height: "74vh", minHeight: 460 }}>
      <div className="hero text-white px-5 py-4 flex items-center gap-3">
        <div className="w-12 h-12 rounded-full bg-white flex items-center justify-center text-2xl shadow" aria-hidden="true">🫒</div>
        <div>
          <h2 className="text-xl font-bold leading-none">Olivia</h2>
          <p className="text-sm text-green-50 mt-1"><span className="inline-block w-2 h-2 rounded-full bg-lime-300 mr-1.5" />Tu asesora en dependencia · Andalucía</p>
        </div>
      </div>
      <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50" aria-live="polite">
        {msgs.map((m, i) => (
          <div key={i} className={"flex items-end gap-2 " + (m.role === "user" ? "justify-end" : "justify-start")}>
            {m.role !== "user" && <div className="w-8 h-8 shrink-0 rounded-full bg-green-100 flex items-center justify-center" aria-hidden="true">🫒</div>}
            <div className={"max-w-[80%] px-4 py-3 whitespace-pre-wrap shadow-sm " + (m.role === "user" ? "text-white rounded-2xl rounded-br-md" : "bg-white text-slate-800 rounded-2xl rounded-bl-md border border-slate-100")} style={m.role === "user" ? { background: "linear-gradient(135deg,#007A33,#2f9a50)" } : {}}>
              {m.content || <span><span className="dot" /> <span className="dot" /> <span className="dot" /></span>}
            </div>
          </div>))}
        <div ref={fin} />
      </div>
      {(() => {
        const ult = msgs[msgs.length - 1];
        const lista = msgs.length === 1 ? SITUACIONES : (ult.seg || SEG_BASE).filter((i) => TIT[i]).map((i) => [TIT[i], i]);
        if (busy || !ult || ult.role !== "assistant" || !ult.content) return null;
        return (
          <div className="px-4 py-3 bg-slate-50 border-t border-slate-100">
            <p className="text-xs font-bold text-slate-500 mb-2">{msgs.length === 1 ? "¿En qué situación estás?" : "Puede que también te interese:"}</p>
            <div className="flex flex-wrap gap-2">
              {lista.map(([l, i]) => (<button key={l} onClick={() => enviar(l, i)} className="text-sm font-semibold px-4 py-2 rounded-full bg-white border border-green-200 hover:bg-green-50 focus:outline-none focus-visible:ring-4 focus-visible:ring-green-300" style={{ color: "var(--gt)" }}>{l}</button>))}
            </div>
          </div>);
      })()}
      <div className="p-3 flex gap-2 bg-white border-t border-slate-100">
        <input value={txt} onChange={(e) => setTxt(e.target.value)} onKeyDown={(e) => e.key === "Enter" && enviar()} placeholder="Escribe tu pregunta a Olivia…" aria-label="Mensaje"
          className="flex-1 bg-slate-100 rounded-full px-5 py-3 focus:outline-none focus:ring-4 focus:ring-green-300" />
        <button onClick={() => enviar()} disabled={busy || !txt.trim()} aria-label="Enviar" className="w-12 h-12 rounded-full text-white text-xl disabled:opacity-40 focus:outline-none focus-visible:ring-4 focus-visible:ring-green-300" style={{ background: G }}>➤</button>

    </section>
  );
}

              {FILTROS.map((f) => (
                <button key={f} onClick={() => { setFiltro(f); setAbierta(null); }} aria-pressed={filtro === f}
                  className={`px-3 py-1.5 rounded-full text-sm border ${focus} ${filtro === f ? "text-white border-transparent" : "bg-white border-slate-300 hover:border-slate-500"}`}
                  style={filtro === f ? { background: G } : {}}>{f}</button>))}
            </div>
            <div className="grid sm:grid-cols-2 gap-4">
              {NOVEDADES.filter((n) => filtro === "Todas" || n.tipo === filtro).map((n) => {
                const open = abierta === n.id; const I = n.icon;
                return (
                  <article key={n.id} className="card bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <span className="inline-flex items-center gap-1.5 text-xs font-bold bg-green-50 rounded-full px-3 py-1" style={{ color: "var(--gt)" }}><span aria-hidden="true">{{"Cuantías":"💶","Servicios":"🤝","Normativa estatal":"⚖️"}[n.tipo] || "📋"}</span>{n.tipo}</span>
                    <h2 className="font-bold text-xl mt-3">{n.titulo}</h2>
                    <p className="text-slate-600 mt-1">{n.resumen}</p>
                    {open && <p className="mt-3 text-slate-700 bg-green-50 rounded-xl p-4 text-sm">{n.detalle}</p>}
                    <button onClick={() => setAbierta(open ? null : n.id)} aria-expanded={open}
                      className={`mt-3 text-sm font-semibold underline rounded ${focus}`} style={{ color: "var(--gt)" }}>
                      {open ? "Ocultar detalle" : "Ver detalle"}</button>
                  </article>);
              })}
            </div>
          </section>
        )}

        {tab === "bot" && <Chat />}

        {tab === "asi" && (
          <section className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
            {!fin ? (
              <>
                <div className="flex items-center justify-between mb-2 text-sm text-slate-500">
                  <span>Paso {paso + 1} de {PASOS.length}</span>
                  <span>{PASOS[paso].t}</span>
                </div>
                <div className="h-2 bg-slate-200 rounded-full mb-5" role="progressbar" aria-valuenow={paso + 1} aria-valuemax={PASOS.length}>
                  <div className="h-2 rounded-full transition-all" style={{ width: `${((paso + 1) / PASOS.length) * 100}%`, background: G }} />
                </div>
                <h2 className="text-xl font-bold mb-3">{PASOS[paso].t}</h2>
                <div className="grid gap-2" role="radiogroup" aria-label={PASOS[paso].t}>
                  {PASOS[paso].o.map(([v, n]) => {
                    const sel = resp[PASOS[paso].k] === v;
                    return (
                      <button key={v} role="radio" aria-checked={sel} onClick={() => setResp({ ...resp, [PASOS[paso].k]: v })}
                        className={`text-left px-5 py-4 rounded-2xl border-2 ${focus} ${sel ? "bg-green-50 font-semibold" : "border-slate-200 hover:border-slate-400"}`}
                        style={sel ? { borderColor: G } : {}}>{n}</button>);
                  })}
                </div>
                <div className="flex justify-between mt-6">
                  <button disabled={paso === 0} onClick={() => setPaso(paso - 1)}
                    className={`flex items-center gap-1 px-4 py-2 rounded-lg border border-slate-300 disabled:opacity-40 ${focus}`}><ChevronLeft size={16} />Anterior</button>
                  <button disabled={!resp[PASOS[paso].k]} onClick={() => setPaso(paso + 1)}
                    className={`flex items-center gap-1 px-4 py-2 rounded-lg text-white disabled:opacity-40 ${focus}`} style={{ background: G }}>
                    {paso === PASOS.length - 1 ? "Ver resultado" : "Siguiente"}<ChevronRight size={16} /></button>
                </div>
              </>
            ) : (
              <div className="space-y-5">
                <h2 className="text-xl font-bold">Resultado de la orientación</h2>
                <p className="printonly text-sm">Plan de intervención orientativo · {new Date().toLocaleDateString("es-ES")}</p>
                <div><h3 className="font-semibold mb-1">Diagnóstico</h3><p className="text-slate-700">{res.diag}</p></div>
                <div><h3 className="font-semibold mb-1">Recursos recomendados</h3><Lista items={res.recs} /></div>
                <div><h3 className="font-semibold mb-1 flex items-center gap-1"><HandCoins size={16} />Copago orientativo</h3><p className="text-slate-700">{res.copago}</p></div>
                <div><h3 className="font-semibold mb-1">Documentación a presentar</h3><Lista items={res.docs} /></div>
                <div><h3 className="font-semibold mb-1">Vías de tramitación</h3><Lista items={res.vias} /></div>
                <div className="noprint acciones flex flex-wrap gap-2 pt-2">
                  <button onClick={copiar} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-white ${focus}`} style={{ background: G }}>
                    {copiado ? <Check size={16} /> : <Copy size={16} />}{copiado ? "Plan copiado" : "Copiar plan de intervención"}</button>
                  <button onClick={() => { setPaso(0); setResp({}); }} className={`flex items-center gap-2 px-4 py-2 rounded-lg border border-slate-300 ${focus}`}><RotateCcw size={16} />Empezar de nuevo</button>
                  <button onClick={imprimir} className={`flex items-center gap-2 px-4 py-2 rounded-lg border border-slate-300 ${focus}`}>🖨️ Imprimir</button>
                  <button onClick={descargar} className={`flex items-center gap-2 px-4 py-2 rounded-lg border border-slate-300 ${focus}`}>⬇️ Descargar .txt</button>
                  {aviso && <p className="w-full text-sm text-amber-700" role="status">{aviso}</p>}
                </div>
              </div>
            )}
          </section>
        )}

        {tab === "rec" && (
          <section className="space-y-6">
            <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
              <h2 className="text-xl font-bold flex items-center gap-2"><Home size={20} style={{ color: "var(--gt)" }} />Simulador de horas de SAD al mes</h2>
              <p className="text-sm text-slate-500 mb-3">Intensidades orientativas para Andalucía según fuentes divulgativas, sin confirmar en la Orden. La cifra concreta la fija el PIA. Si el PIA incluye también centro de día (grado II nivel 2 y grado III), el SAD tiene como máximo 22 horas al mes, de lunes a viernes.</p>
              <div className="flex gap-2 mb-4" role="group" aria-label="Grado">
                {Object.keys(SAD).map((g) => (
                  <button key={g} onClick={() => setGrado(g)} aria-pressed={grado === g}
                    className={`px-4 py-2 rounded-lg border-2 font-semibold ${focus} ${grado === g ? "text-white border-transparent" : "border-slate-300"}`}
                    style={grado === g ? { background: G } : {}}>Grado {g}</button>))}
              </div>
              <label className="block text-sm font-medium mb-1" htmlFor="niv">Necesidad de apoyo dentro del grado</label>
              <input id="niv" type="range" min="0" max="100" value={nivel} onChange={(e) => setNivel(+e.target.value)} className="w-full" style={{ accentColor: G }} />
              <div className="mt-4 rounded-lg bg-green-50 p-4">
                <p className="text-sm text-slate-600">{sad.nota}: de {sad.min} a {sad.max} horas al mes</p>
                <p className="text-3xl font-bold" style={{ color: "var(--gt)" }}>{horas} h/mes</p>
                <p className="text-sm text-slate-600">Unas {(horas / 4.345).toFixed(1)} horas por semana</p>
              </div>
            </div>
            <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
              <h2 className="text-xl font-bold flex items-center gap-2 mb-3"><BookOpen size={20} style={{ color: "var(--gt)" }} />Glosario</h2>
              <dl className="divide-y divide-slate-200">
                {GLOSARIO.map(([t, d]) => (
                  <div key={t} className="py-2"><dt className="font-semibold" style={{ color: "var(--gt)" }}>{t}</dt><dd className="text-slate-700">{d}</dd></div>))}
              </dl>
            </div>
          </section>
        )}
      </main>
      <footer className="noprint max-w-4xl mx-auto px-5 pb-28 sm:pb-10 text-xs text-slate-500 text-center">
        Herramienta informativa no oficial, en pruebas. Sin vinculación con la Junta de Andalucía ni con la ASSDA. No sustituye el asesoramiento de Servicios Sociales. No se guarda ningún dato personal. Última actualización: 24 de octubre de 2026.
      </footer>
      <nav className="noprint sm:hidden fixed bottom-0 inset-x-0 z-20 bg-white/90 backdrop-blur border-t border-slate-200 grid grid-cols-4" style={{ paddingBottom: "env(safe-area-inset-bottom, 0px)" }} aria-label="Secciones">
        {tabs.map(([id, n, e]) => (
          <button key={id} onClick={() => setTab(id)} aria-current={tab === id}
            className={`flex flex-col items-center gap-0.5 py-2 text-xs font-bold ${focus} ${tab === id ? "" : "text-slate-500"}`}
            style={tab === id ? { color: "var(--gt)", boxShadow: "inset 0 3px 0 " + G } : {}}>
            <span className="text-xl" aria-hidden="true">{e}</span>{{ nov: "Novedades", asi: "Situación", bot: "Olivia", rec: "Recursos" }[id]}
          </button>))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
